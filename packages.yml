# Configure automatic updates for ebuilds.
media-video/gpu-screen-recorder-ui:
  resolver: git
  options:
    url: https://repo.dec05eba.com/gpu-screen-recorder-ui

media-video/gpu-screen-recorder-notification:
  resolver: git
  options:
    url: https://repo.dec05eba.com/gpu-screen-recorder-notification

x11-misc/copyq:
  resolver: git
  options:
    url: https://github.com/hluk/CopyQ

net-misc/et:
  resolver: git
  options:
    url: https://github.com/MisterTea/EternalTerminal
    disable_semver: true
    ignore_versions:
      - v1.*
    version_transform:
      from: "et-v"
      to: ""

media-sound/dmidiplayer:
  resolver: git
  options:
    url: https://github.com/pedrolcl/dmidiplayer

media-video/ffsubsync-bin:
  resolver: git
  options:
    url: https://github.com/smacke/ffsubsync